<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Location | Tour Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>

    <main class="auth-shell">
      <section class="panel auth-card">
        <p class="eyebrow">Step 2</p>
        <h1>Select Yercaud Location</h1>
        <p class="subtitle">Choose the Yercaud tourist spot you want to explore.</p>

        <label for="locationSelect">Yercaud Tourist Places</label>
        <select id="locationSelect"></select>

        <button id="viewGuideBtn" class="primary">View Tour Guide</button>
        <p id="locationStatus" class="status">Select a location and continue.</p>
      </section>
    </main>

    <script type="module" src="location.js"></script>
  </body>
</html>
