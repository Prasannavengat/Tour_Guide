<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Pulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="tour-app-styles.css" />
</head>
<body>
    <a href="/admin/?v=live" class="admin-link" style="position:fixed;right:18px;top:18px;background:var(--panel);padding:8px 12px;border-radius:8px;box-shadow:var(--shadow);text-decoration:none;color:var(--accent);font-weight:700;">Admin</a>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>

    <!-- Page 1: Tourist Info -->
    <div id="page-1" class="page active">
        <main class="app-shell">
            <section class="panel form-card">
                <h1 class="welcome-title">Welcome to Tour Pulse</h1>
                <p class="subtitle">Tell us about your tour group</p>

                <form id="touristForm" class="form-group">
                    <div class="form-field">
                        <label for="touristName">Your Name</label>
                        <input 
                            id="touristName" 
                            type="text" 
                            placeholder="Enter your name"
                            required
                            minlength="2"
                        />
                    </div>

                    <div class="form-field">
                        <label for="memberCount">Number of Members</label>
                        <input 
                            id="memberCount" 
                            type="number" 
                            placeholder="How many people in your group?"
                            required
                            min="1"
                            max="1000"
                        />
                    </div>

                    <div class="button-row">
                        <button type="submit" class="primary">Continue</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Page 2: Place Selection -->
    <div id="page-2" class="page">
        <header class="app-header">
            <h1>Select a Place</h1>
        </header>
        <main class="app-shell">
            <div id="greeting" class="greeting-card">
                <p id="greetingText"></p>
            </div>

            <div id="placesLoader" class="loader">
                <div class="spinner"></div>
                <p>Loading places...</p>
            </div>

            <div id="placesContainer" class="places-grid"></div>

            <div id="placesError" class="error-container" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <p id="placesErrorText"></p>
                <button onclick="loadPlaces()" class="secondary">Retry</button>
            </div>
        </main>
    </div>

    <!-- Page 3: Place Details -->
    <div id="page-3" class="page">
        <header class="app-header">
            <h1>Place Details</h1>
        </header>

        <div id="placeHeader" class="place-header">
            <h2 id="placeName"></h2>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="label">Current Crowd</span>
                    <span id="crowdCount" class="value"></span>
                </div>
                <div class="occupancy-circle">
                    <svg viewBox="0 0 100 100" class="circle-svg">
                        <circle cx="50" cy="50" r="45" class="bg-circle"></circle>
                        <circle cx="50" cy="50" r="45" class="progress-circle" id="occupancyCircle"></circle>
                    </svg>
                    <div class="circle-text">
                        <span id="occupancyPercent" class="percent">0%</span>
                        <span class="label">Occupancy</span>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="label">Status</span>
                    <span id="placeStatus" class="status-badge"></span>
                </div>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="facilities">
                    <i class="fas fa-building"></i> Facilities
                </button>
                <button class="tab-btn" data-tab="recommendations">
                    <i class="fas fa-lightbulb"></i> Recommendations
                </button>
                <button class="tab-btn" data-tab="map">
                    <i class="fas fa-map"></i> Map
                </button>
            </div>

            <div id="details-loader" class="loader" style="display: none;">
                <div class="spinner"></div>
                <p>Loading details...</p>
            </div>

            <!-- Facilities Tab -->
            <div id="facilities-tab" class="tab-content active">
                <div class="facility-filters">
                    <button class="filter-chip active" data-type="hospital">
                        <i class="fas fa-hospital"></i> Hospitals
                    </button>
                    <button class="filter-chip" data-type="hotel">
                        <i class="fas fa-hotel"></i> Hotels
                    </button>
                    <button class="filter-chip" data-type="essentials">
                        <i class="fas fa-shopping-bag"></i> Essentials
                    </button>
                </div>
                <div id="facilitiesList" class="facilities-list"></div>
            </div>

            <!-- Recommendations Tab -->
            <div id="recommendations-tab" class="tab-content">
                <div class="recommendations-intro">
                    <p><i class="fas fa-info-circle"></i> Less-Crowded Alternatives</p>
                </div>
                <div id="recommendationsList" class="recommendations-list"></div>
            </div>

            <!-- Map Tab -->
            <div id="map-tab" class="tab-content">
                <div id="mapContainer" class="map-container"></div>
            </div>
        </div>

        <div id="detailsError" class="error-container" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <p id="detailsErrorText"></p>
            <button onclick="loadPlaceDetails()" class="secondary">Retry</button>
        </div>
    </div>

    <script src="tour-app.js"></script>
</body>
</html>
