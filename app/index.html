<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Pulse Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>

    <main class="auth-shell">
      <section class="panel auth-card">
        <p class="eyebrow">Tour Pulse Guide</p>
        <h1>Tourist Login</h1>
        <p class="subtitle">
          "Protect nature while you travel: safer places, cleaner spaces, and mindful footsteps for every journey."
        </p>

        <label for="touristPhone">Phone Number</label>
        <input id="touristPhone" type="tel" placeholder="Enter mobile number (e.g. +14155552671)" />

        <div class="button-row">
          <button id="sendOtpBtn" class="primary">Get OTP</button>
        </div>

        <div id="otpSection" style="display: none;">
          <label for="touristOtp">Enter OTP</label>
          <input id="touristOtp" type="text" maxlength="6" placeholder="6-digit OTP" />
          <div class="button-row">
            <button id="verifyOtpBtn">Verify OTP</button>
          </div>
        </div>

        <div id="nameSection" style="display: none;">
          <label for="touristName">Your Name</label>
          <input id="touristName" type="text" placeholder="Enter your name" />
        </div>

        <button id="loginBtn" class="primary">Continue</button>
        <p id="loginStatus" class="status">Verify your phone to continue.</p>
      </section>
    </main>

    <script type="module" src="login.js"></script>
  </body>
</html>
